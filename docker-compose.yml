services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_POOLER_URL:-${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/master_terminal}}
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
